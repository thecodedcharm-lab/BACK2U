<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACK2U - Splash</title>
    <link rel="stylesheet" href="a.css">
</head>

<body>

<div class="phone splash-screen">

    <!-- Status Bar -->
    <div class="status-bar">
        <span class="time">9:41</span>

        <div class="status-icons">
            <span class="signal">
                <i></i>
                <i></i>
                <i></i>
                <i></i>
            </span>

            <span class="wifi">
                <svg viewBox="0 0 24 18">
                    <path d="M2 5.5C7.5 0.8 16.5 0.8 22 5.5"></path>
                    <path d="M5 9C9 5.8 15 5.8 19 9"></path>
                    <path d="M9 12.5C11 11 13 11 15 12.5"></path>
                    <circle cx="12" cy="15" r="1"></circle>
                </svg>
            </span>

            <span class="battery">
                <span></span>
            </span>
        </div>
    </div>

    <!-- Logo -->
    <div class="splash-logo">
        <div class="logo-icon">
            <span>×</span>
        </div>

        <h1>
            <span>BACK</span><b>2</b><span>U</span>
        </h1>

        <p>Lost. Found. Back to you.</p>
    </div>

    <!-- Main Text -->
    <div class="splash-content">
        <h2>Recover lost items instantly</h2>

        <p>
            Replacing messy chat groups with one structured<br>
            lost &amp; found platform for your college campus.
        </p>
    </div>

    <!-- Button -->
    <a href="2.html"><button class="get-started">Get Started</button></a>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>

</div>

</body>
</html>
