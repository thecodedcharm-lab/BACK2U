<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACK2U - Sign Up</title>
    <link rel="stylesheet" href="a.css">
</head>

<body>

<div class="phone signup-screen">

    <!-- Status Bar -->
    <div class="status-bar">
        <span class="time">9:41</span>

        <div class="status-icons">
            <span class="signal">
                <i></i>
                <i></i>
                <i></i>
                <i></i>
            </span>

            <span class="wifi">
                <svg viewBox="0 0 24 18">
                    <path d="M2 5.5C7.5 0.8 16.5 0.8 22 5.5"></path>
                    <path d="M5 9C9 5.8 15 5.8 19 9"></path>
                    <path d="M9 12.5C11 11 13 11 15 12.5"></path>
                    <circle cx="12" cy="15" r="1"></circle>
                </svg>
            </span>

            <span class="battery">
                <span></span>
            </span>
        </div>
    </div>

    <!-- Sign Up Content -->
    <main class="signup-content">

        <h1>Join Back2U</h1>

        <p class="subtitle">
            Verify your campus email to keep the platform safe and authentic.
        </p>

        <!-- Full Name -->
        <label>Full Name</label>

        <div class="input-box">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5.5 20C5.5 16.4 8.2 14 12 14C15.8 14 18.5 16.4 18.5 20"></path>
            </svg>

            <input type="text" value="Alex Rivera">
        </div>

        <!-- Campus Email -->
        <label>Campus Email</label>

        <div class="input-box">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="M4 7L12 13L20 7"></path>
            </svg>

            <input type="email" value="alex.rivera@university.edu">
        </div>

        <!-- Password -->
        <label>Password</label>

        <div class="input-box">
            <svg viewBox="0 0 24 24">
                <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                <path d="M8 10V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V10"></path>
            </svg>

            <input type="password" value="password">
        </div>

        <!-- Terms -->
        <p class="terms">
            By signing up, you agree to our
            <strong>Campus Guidelines</strong> and
            <strong>Privacy Policy.</strong>
        </p>

        <!-- Create Account -->
        <a href=3.html>
            <button class="create-account">
            Create Account
            </button>
        </a>

        <!-- Divider -->
        <div class="divider">
            <span></span>
            <p>or sign up with</p>
            <span></span>
        </div>

        <!-- Google -->
        <button class="google-button">
            <span class="google-icon">⊗</span>
            Sign up with Google
        </button>

        <!-- Login -->
        <p class="login-text">
            Already have an account?
            <strong>Log in</strong>
        </p>

    </main>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>

</div>

</body>
</html>
